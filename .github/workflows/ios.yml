# Nativní iOS Qamera DEV: sestaví nepodepsané .ipa (podepíše a nahraje Sideloadly na Windows)
name: iOS build

on:
  push:
    branches: [dev]
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)"
          xcodebuild -version

      - name: Projekt (XcodeGen)
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Sestavení
        run: |
          cd ios
          xcodebuild -project Qamera.xcodeproj -target Qamera -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > build.log 2>&1 || {
            grep -E "error:" build.log | sort -u | head -40 | while read -r l; do echo "::error::$l"; done
            tail -80 build.log
            exit 1
          }
          grep -E "warning:" build.log | grep "/ios/Sources/" | sort -u | head -20 | while read -r l; do echo "::warning::$l"; done
          tail -5 build.log

      - name: Balíček .ipa
        run: |
          cd ios
          mkdir -p out/Payload
          cp -R build/Release-iphoneos/Qamera.app out/Payload/
          cd out && zip -qry Qamera-DEV.ipa Payload && ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: Qamera-DEV-ipa
          path: ios/out/Qamera-DEV.ipa
          retention-days: 30
