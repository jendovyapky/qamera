# XcodeGen – z tohohle souboru se v GitHub Actions vygeneruje Qamera.xcodeproj (xcodeproj se necommituje)
name: Qamera
options:
  bundleIdPrefix: eu.jendovyapky
  deploymentTarget:
    iOS: "17.0"
targets:
  Qamera:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Qamera DEV
        CFBundleShortVersionString: "0.1.1"
        CFBundleVersion: "2"
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Qamera potřebuje kameru, aby mohla fotit.
        NSPhotoLibraryAddUsageDescription: Qamera ukládá vyfocené snímky do Fotek.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.jendovyapky.qamera.dev
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
